name: threshold

# Threshold self-hosted stack. One command:
#   docker compose up --build
# Point it at your OWN authorized lab by setting PENTEST_AGENTS_LAB_CIDR in .env.
# To try it against the bundled Juice Shop instead, add the test overlay:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --build

services:
  hexstrike:
    build:
      context: ./hexstrike-ai
      dockerfile: Dockerfile
      args:
        TOOLSET: ${HEXSTRIKE_TOOLSET:-curated}
    expose:
      - "8888"
    cap_add:
      - NET_RAW      # raw sockets for nmap SYN scans etc.
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: pentest-agents/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HEXSTRIKE_BACKEND_URL: http://hexstrike:8888
      HEXSTRIKE_SERVER_PATH: /opt/hexstrike/hexstrike_mcp.py
      HEXSTRIKE_COMMAND: python
      PENTEST_AGENTS_MEMORY_PATH: /data/chroma
      PENTEST_AGENTS_REPORT_DIR: /data/reports
      # Phase 2c: durable AsyncSqliteSaver checkpoint + engagements table,
      # in the same bind-mounted volume as reports/chroma so engagements
      # survive `docker compose restart orchestrator`.
      PENTEST_AGENTS_DB_PATH: /data/threshold.db
    volumes:
      - ./data:/data
      # Serve the dashboard + landing page from source (read-only) so frontend
      # edits show without an image rebuild and survive container recreates —
      # otherwise the baked-in copies silently revert any web/ change on recreate.
      - ./pentest-agents/web:/app/web:ro
      - ./pentest-agents/landing:/app/landing:ro
    depends_on:
      hexstrike:
        condition: service_healthy
    restart: unless-stopped

