name: threshold

# Threshold self-hosted stack. The Juice Shop lab is opt-in with the `lab` profile.

services:
  hexstrike:
    build:
      context: ./hexstrike-ai
      dockerfile: Dockerfile
      args:
        TOOLSET: ${HEXSTRIKE_TOOLSET:-curated}
    expose:
      - "8888"
    volumes:
      - ./hexstrike-ai/hexstrike_server.py:/opt/hexstrike/hexstrike_server.py:ro
      - ./hexstrike-ai/templates:/opt/hexstrike/templates:ro
    networks:
      - default
      - target_lab
    cap_add:
      - NET_RAW      # raw sockets for nmap SYN scans etc.
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: pentest-agents/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - target_lab
    env_file:
      - .env
    environment:
      HEXSTRIKE_BACKEND_URL: http://hexstrike:8888
      HEXSTRIKE_SERVER_PATH: /opt/hexstrike/hexstrike_mcp.py
      HEXSTRIKE_COMMAND: python
      PENTEST_AGENTS_MEMORY_PATH: /data/chroma
      PENTEST_AGENTS_REPORT_DIR: /data/reports
      # Phase 2c: durable AsyncSqliteSaver checkpoint + engagements table,
      # in the same bind-mounted volume as reports/chroma so engagements
      # survive `docker compose restart orchestrator`.
      PENTEST_AGENTS_DB_PATH: /data/threshold.db
      PENTEST_AGENTS_RESULTS_DIR: /results
      PENTEST_AGENTS_DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./results:/results
    depends_on:
      hexstrike:
        condition: service_healthy
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop:latest
    profiles:
      - lab
    networks:
      target_lab:
        ipv4_address: 172.30.255.10
    restart: unless-stopped

  juice-shop-web:
    image: nginx:alpine
    profiles:
      - lab
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker/juice-shop-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      juice-shop:
        condition: service_started
    networks:
      - default
      - target_lab
    restart: unless-stopped

networks:
  default:
    name: threshold_default
  target_lab:
    name: threshold_target_lab
    internal: true
    ipam:
      config:
        - subnet: 172.30.255.0/24
